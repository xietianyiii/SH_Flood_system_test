<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Leaflet 加载 GeoServer WMS 图层</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // 初始化 Leaflet 地图
        var map = L.map('map').setView([31.0, 121.5], 8); // 设置中心点 [纬度, 经度] 和缩放级别

        // 添加 OpenStreetMap 底图
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 添加 GeoServer WMS 图层
        L.tileLayer.wms('http://47.113.180.32:8090/geoserver/flood/wms', {
            layers: 'flood:384', // 要显示的 WMS 图层
            format: 'image/png',
            transparent: true,
            attribution: 'GeoServer'
        }).addTo(map);
    </script>
</body>
</html>
